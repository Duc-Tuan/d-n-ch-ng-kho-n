# Giá trị cho header `Connection` khi chuyển tiếp lên backend.
#
# Không viết cứng "upgrade" cho mọi request: request HTTP thường mà mang `Connection: upgrade`
# thì mất keep-alive giữa nginx và backend, và mỗi lượt gọi API lại phải bắt tay TCP mới. Bảng
# map này trả "upgrade" đúng cho request WebSocket và "close" cho phần còn lại.
#
# Đặt được ở đây vì file này được nạp qua `conf.d/*.conf`, tức là đã nằm trong khối `http` —
# nơi duy nhất chỉ thị `map` hợp lệ. Đưa vào trong `server` bên dưới thì nginx không khởi động.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name phantichck.com;

    # Mặc định nginx chỉ nhận request 1MB — thấp hơn nhiều so với trần tải tài liệu thật
    # (MAX_UPLOAD_MB=50 ở backend/app/core/config.py). Không nâng lên thì mọi file quá 1MB gửi
    # qua tên miền bị nginx chặn với 413 trước khi tới được app, còn gọi thẳng qua :3000 (bỏ qua
    # nginx) thì không bị giới hạn này nên vẫn tải lên bình thường.
    client_max_body_size 55m;

    # `/api/*` (REST lẫn WebSocket) đi THẲNG vào backend FastAPI ở :8000, không qua Next.js.
    #
    # Next.js có `rewrites()` riêng để tự chuyển `/api/v1/*` sang backend (xem
    # frontend/next.config.mjs) — dùng khi chạy `next dev`/`next start` một mình không qua nginx.
    # Nhưng cơ chế rewrite đó CHỈ xử lý được HTTP thường: một request WebSocket đi qua nó bị tước
    # mất header `Upgrade` và biến thành GET thường, nên FastAPI thấy route `/ws/market` không
    # khớp scope websocket và trả 404 — đúng triệu chứng "Đang kết nối" mãi không xong trên bảng
    # giá khách hàng dù các API REST khác qua cùng đường vẫn 200 OK bình thường.
    #
    # Route thẳng tới backend ở đây tránh hẳn cái hop Next.js đó, nên WebSocket bắt tay được.
    location /api/ {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Hai dòng này là điều kiện bắt buộc để nâng cấp HTTP lên WebSocket. Thiếu chúng thì
        # `proxy_http_version 1.1` ở trên **không đủ**: nginx nuốt mất header Upgrade, bắt tay
        # WebSocket không bao giờ hoàn tất, và mọi kênh real-time (/ws/customer, /ws/admin,
        # /ws/market) im lặng không chạy qua tên miền — trong khi gọi thẳng :8000 vẫn chạy tốt,
        # nên lỗi chỉ xuất hiện trên production và không tái hiện được ở máy lập trình.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # File lớn qua mạng chậm cần nhiều thời gian đọc/ghi hơn mức mặc định 60s.
        #
        # Với WebSocket, mốc này là thời gian **im lặng** tối đa trước khi nginx đóng kết nối.
        # Phiên nghỉ trưa dài hơn 5 phút rất nhiều và không có giá nào đổi trong khoảng đó, nên
        # kênh giá tự gửi ping mỗi 30 giây để không bị cắt giữa phiên.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
