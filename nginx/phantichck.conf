server {
    listen 80;
    server_name phantichck.com;

    # Mặc định nginx chỉ nhận request 1MB — thấp hơn nhiều so với trần tải tài liệu thật
    # (MAX_UPLOAD_MB=50 ở backend/app/core/config.py). Không nâng lên thì mọi file quá 1MB gửi
    # qua tên miền bị nginx chặn với 413 trước khi tới được app, còn gọi thẳng qua :3000 (bỏ qua
    # nginx) thì không bị giới hạn này nên vẫn tải lên bình thường.
    client_max_body_size 55m;

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # File lớn qua mạng chậm cần nhiều thời gian đọc/ghi hơn mức mặc định 60s.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
